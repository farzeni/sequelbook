name: Wails v3 Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: sequelbook-linux
          - os: windows-latest
            platform: windows/amd64
            artifact_name: sequelbook-windows.exe
          - os: macos-latest
            platform: darwin/universal
            artifact_name: sequelbook-macos.app.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential pkg-config

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build Application
        shell: bash
        run: |
          # In v3, variables are passed as KEY=VALUE positional args
          # We use 'package' for Mac to get the .app, 'build' for others
          if [ "${{ runner.os }}" == "macOS" ]; then
            wails3 package PLATFORM=${{ matrix.platform }}
          elif [ "${{ runner.os }}" == "Linux" ]; then
            wails3 build PLATFORM=${{ matrix.platform }} FLAGS="-tags webkit2_41"
          else
            wails3 build PLATFORM=${{ matrix.platform }}
          fi
        env:
          CGO_ENABLED: 1

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" == "macOS" ]; then
            # macOS .app is a folder, must be zipped for GitHub Releases
            cd bin && zip -r ../dist/${{ matrix.artifact_name }} *.app && cd ..
          elif [ "${{ runner.os }}" == "Windows" ]; then
            cp bin/*.exe dist/${{ matrix.artifact_name }} || cp bin/* dist/${{ matrix.artifact_name }}
          else
            cp bin/* dist/${{ matrix.artifact_name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/**/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}