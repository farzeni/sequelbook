name: Wails v3 Build & Release

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag starting with 'v'

env:
  GO_VERSION: "1.25" # Updated per v3 alpha docs
  NODE_VERSION: "20"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: myapp-linux
          - os: windows-latest
            platform: windows/amd64
            artifact_name: myapp-windows.exe
          - os: macos-latest
            platform: darwin/universal
            artifact_name: myapp-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Install Linux Dependencies (Essential for GTK/WebKit)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential pkg-config

      # Install Wails v3 CLI
      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      # Run Wails build
      # Note: v3 uses 'wails3 build', which executes the Taskfile.yml in your project
      - name: Build Application
        run: |
          wails3 build -platform ${{ matrix.build.platform }} -tags webkit2_41
        env:
          CGO_ENABLED: 1

      # Prepare binaries for release
      # Wails v3 usually outputs to the /bin folder
      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp bin/*.exe dist/${{ matrix.artifact_name }} || cp bin/* dist/${{ matrix.artifact_name }}
          else
            cp bin/* dist/${{ matrix.artifact_name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/**/*
          generate_release_notes: true
          # This ensures the release is created for the tag that triggered the workflow
          tag_name: ${{ github.ref_name }} 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}